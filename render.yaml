# Render Blueprint (https://render.com/docs/blueprint-spec). Apply from the
# Render dashboard: New -> Blueprint -> select this repo. Every service maps
# 1:1 onto how this repo already describes itself running (see each
# service's own README / module docstring for the "why").
#
# TEMPORARILY TRIMMED TO THE THREE FREE-TIER SERVICES (qmi-api, qmi-web,
# qmi-redis) so the very first Blueprint apply doesn't force a card into
# Render before we've confirmed the mechanics work at all. apps/api and
# apps/web both run fine with no database configured (see server.ts: /auth,
# /market, etc. simply aren't registered without DATABASE_URL — only
# /health is guaranteed). The four paid-only services (qmi-postgres,
# qmi-market-data, qmi-run-pipeline, qmi-research-runner) are commented out
# below, in full, ready to uncomment once you've decided to add a card —
# see docs/deployment/RENDER-DEPLOYMENT.md.

services:
  - type: keyvalue
    name: qmi-redis
    plan: free # in-memory only, lost on restart — fine here, it's only a pub/sub relay
    ipAllowList: [] # no public access; only other services in this Blueprint reach it

  # --- apps/api: gateway / auth / orchestration ---

  - type: web
    name: qmi-api
    runtime: node
    plan: free # spins down after ~15min idle; wakes on the next request in a few seconds
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build:packages && pnpm --filter @qmi/api run build
    startCommand: pnpm --filter @qmi/api run start
    envVars:
      - key: NODE_ENV
        value: production
      # apps/api reads API_PORT (packages/config), not Render's own PORT —
      # both are pinned to the same literal so Render's router and Fastify
      # agree on where traffic actually lands.
      - key: PORT
        value: "4000"
      - key: API_PORT
        value: "4000"
      - key: API_PUBLIC_URL
        value: https://qmi-api.onrender.com
      - key: SESSION_COOKIE_NAME
        value: qmi_session
      - key: SESSION_TTL_SECONDS
        value: "604800"
      - key: REDIS_URL
        fromService:
          name: qmi-redis
          type: keyvalue
          property: connectionString
      # DATABASE_URL deliberately absent for now — see the header comment.
      # Add it back (sync: false) once qmi-postgres exists.
      # Unset on purpose: apps/api simply doesn't register SSO routes
      # without it (see packages/config). Add it manually if/when SSO is
      # actually wanted: openssl rand -base64 32.
      # - key: AUTH_ENCRYPTION_KEY

  # --- apps/web: dashboard ---

  - type: web
    name: qmi-web
    runtime: node
    plan: free # spins down after ~15min idle; wakes on the next request in a few seconds
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build:packages && pnpm --filter @qmi/web run build
    # Next.js's `next start` doesn't read Render's $PORT on its own; passed
    # through explicitly. NEXT_PUBLIC_API_URL is inlined at *build* time
    # (see next.config.mjs), so it must already be set above, not just at
    # runtime.
    startCommand: pnpm --filter @qmi/web run start -- -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://qmi-api.onrender.com

  # --- Everything below needs a card on file (no free tier on Render for
  # private services, background workers, or cron jobs) — commented out
