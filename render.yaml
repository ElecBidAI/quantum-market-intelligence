# Render Blueprint (https://render.com/docs/blueprint-spec). Apply from the
# Render dashboard: New -> Blueprint -> select this repo.
#
# EVERYTHING HERE IS FREE — no card required anywhere in this file.
# `data/migrations/` no longer depends on the TimescaleDB extension (it
# only ever used it for hypertables — automatic time-based partitioning,
# irrelevant at this data volume; removed rather than paying to self-host
# Postgres just to get an extension nothing actually needs yet). That
# unlocks Render's own free managed Postgres, which doesn't support
# TimescaleDB but works fine for plain tables.
#
# What's covered here: qmi-postgres (free managed Postgres), qmi-redis
# (free Key Value), qmi-api, qmi-web (free web services).
#
# What's NOT covered here, and why:
# - services/market-data (the exchange-ingestion worker) needs to run
#   continuously, and Render has no free tier at all for Background
#   Workers — only Web Services, Key Value, and (as of this file) Postgres
#   have one. There's no way to run this specific piece for $0 on Render.
#   Run it locally when you want fresh data (as this project has been
#   doing), or revisit paying for just this one service later — see
#   docs/deployment/RENDER-DEPLOYMENT.md.
# - The two Python batch jobs (ai_council.run_pipeline,
#   backtester.research_runner) moved to GitHub Actions scheduled
#   workflows instead of Render Cron Jobs (which also have no free tier)
#   — see .github/workflows/.

databases:
  - name: qmi-postgres
    plan: free # 1GB, expires 30 days after creation on Render's free tier — see the deployment doc
    databaseName: qmi
    user: qmi

services:
  - type: keyvalue
    name: qmi-redis
    plan: free # in-memory only, lost on restart — fine here, it's only a pub/sub relay
    ipAllowList: [] # no public access; only other services in this Blueprint reach it

  # --- apps/api: gateway / auth / orchestration ---

  - type: web
    name: qmi-api
    runtime: node
    plan: free # spins down after ~15min idle; wakes on the next request in a few seconds
    # `corepack enable` fails here (Render's build image has a read-only
    # /usr/bin, and corepack needs to write its pnpm shim there) — npx runs
    # pnpm from its own writable cache instead, sidestepping that entirely.
    buildCommand: npx pnpm@11.13.1 install --frozen-lockfile && npx pnpm@11.13.1 run build:packages && npx pnpm@11.13.1 --filter @qmi/api run build
    startCommand: npx pnpm@11.13.1 --filter @qmi/api run start
    envVars:
      - key: NODE_ENV
        value: production
      # apps/api reads API_PORT (packages/config), not Render's own PORT —
      # both are pinned to the same literal so Render's router and Fastify
      # agree on where traffic actually lands.
      - key: PORT
        value: "4000"
      - key: API_PORT
        value: "4000"
      - key: API_PUBLIC_URL
        value: https://qmi-api.onrender.com
      - key: SESSION_COOKIE_NAME
        value: qmi_session
      - key: SESSION_TTL_SECONDS
        value: "604800"
      - key: REDIS_URL
        fromService:
          name: qmi-redis
          type: keyvalue
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: qmi-postgres
          property: connectionString
      # Unset on purpose: apps/api simply doesn't register SSO routes
      # without it (see packages/config). Add it manually if/when SSO is
      # actually wanted: openssl rand -base64 32.
      # - key: AUTH_ENCRYPTION_KEY

  # --- apps/web: dashboard ---

  - type: web
    name: qmi-web
    runtime: node
    plan: free # spins down after ~15min idle; wakes on the next request in a few seconds
    # See qmi-api's buildCommand comment re: corepack.
    buildCommand: npx pnpm@11.13.1 install --frozen-lockfile && npx pnpm@11.13.1 run build:packages && npx pnpm@11.13.1 --filter @qmi/web run build
    # `next start` reads Render's $PORT natively (its -p/--port option
    # defaults to env: PORT — confirmed in Next's own CLI docs), so no
    # extra flag is needed. NEXT_PUBLIC_API_URL is inlined at *build* time
    # (see next.config.mjs), so it must already be set above, not just at
    # runtime.
    startCommand: npx pnpm@11.13.1 --filter @qmi/web run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://qmi-api.onrender.com
