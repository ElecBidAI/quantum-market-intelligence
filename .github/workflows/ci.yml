name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Node (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  python:
    name: Python quant-core + feature-engine (lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install quant-core and feature-engine
        run: pip install -e "packages/quant-core[dev]" -e "services/feature-engine[dev]"

      - name: Lint (ruff)
        run: ruff check packages/quant-core services/feature-engine

      - name: Test (pytest)
        run: pytest packages/quant-core/tests services/feature-engine/tests
