name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Node (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  python:
    name: Python (lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install all Python packages
        run: |
          pip install -e "packages/quant-core[dev]" \
                      -e "services/feature-engine[dev]" \
                      -e "services/risk-engine[dev]" \
                      -e "services/backtester[dev]" \
                      -e "services/simulation-engine[dev]" \
                      -e "services/regime-engine[dev]" \
                      -e "services/strategy-engine[dev]" \
                      -e "services/paper-execution[dev]"

      - name: Lint (ruff)
        run: |
          ruff check packages/quant-core services/feature-engine \
                     services/risk-engine services/backtester services/simulation-engine \
                     services/regime-engine services/strategy-engine services/paper-execution

      - name: Test (pytest)
        # --import-mode=importlib: two packages both have a tests/test_engine.py;
        # the default import mode collides on that basename when run together.
        run: |
          pytest --import-mode=importlib \
                 packages/quant-core/tests services/feature-engine/tests \
                 services/risk-engine/tests services/backtester/tests \
                 services/simulation-engine/tests services/regime-engine/tests \
                 services/strategy-engine/tests services/paper-execution/tests
